<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shift &amp; Machine Log</title>
  <style>
    :root {
      --bg: #070d19;
      --surface: #0f192d;
      --surface-2: #16233e;
      --border: #24365b;
      --text: #e8eefc;
      --muted: #94a3c4;
      --green: #16a34a;
      --green-bright: #22c55e;
      --green-bg: rgba(22, 163, 74, 0.18);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.16);
      --blue: #3b82f6;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 90px;
    }

    .app { max-width: 560px; margin: 0 auto; }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .header h1 { font-size: 1.2rem; font-weight: 700; }
    .today-pill {
      background: var(--green-bg);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px;
      border-radius: var(--radius);
      margin-bottom: 16px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Cards & Buttons */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: var(--green);
      color: #fff;
      font-size: 1.05rem;
      padding: 18px;
      margin-bottom: 12px;
    }
    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-sm {
      width: auto;
      padding: 7px 11px;
      font-size: 0.8rem;
      border-radius: 8px;
    }
    .btn-danger {
      background: var(--red-bg);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .btn-outline {
      background: transparent;
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    /* Inputs */
    label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Badges & Notices */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-warn {
      background: var(--amber-bg);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .badge-ok {
      background: var(--green-bg);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }
    .badge-repeat {
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.38);
      cursor: pointer;
    }

    .notice {
      background: var(--amber-bg);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    /* List Items */
    .item-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .item-title { font-weight: 700; font-size: 0.98rem; }
    .item-sub { color: var(--muted); font-size: 0.84rem; margin-top: 2px; }
    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .linked-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.82rem;
      color: var(--muted);
    }
    .linked-row {
      padding: 6px 8px;
      background: rgba(15, 25, 45, 0.7);
      border-radius: 8px;
      margin-top: 6px;
      color: var(--text);
    }

    /* Active Timer Banner */
    .active-banner {
      background: rgba(22, 163, 74, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }

    /* Undo Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 520px;
      background: #1e293b;
      border: 1px solid #475569;
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      display: none;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }
    .toast.show { display: flex; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Shift &amp; Machine Log</h1>
      <div class="today-pill" id="todayHoursPill">Today: 0.00h</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="log">Log</button>
      <button class="tab-btn" data-tab="history">History</button>
      <button class="tab-btn" data-tab="machines">Machines</button>
    </div>

    <!-- LOG TAB: Keeps original Start Work / Manual Entry start flow -->
    <section class="panel active" id="panel-log">
      <div id="activeWorkBox" class="active-banner" style="display:none;"></div>

      <button class="btn btn-primary" id="startWorkBtn">&#9654; START WORK</button>

      <div class="card">
        <button class="btn btn-secondary" id="manualEntryBtn">Log Manual / Past Entry</button>
      </div>

      <!-- Job Entry Form (shown only after clicking Start Work or Manual Entry) -->
      <div class="card" id="jobFormCard" style="display:none;">
        <div class="card-title" id="jobFormTitle">Job Details</div>

        <label for="jobRoom">Room ID</label>
        <input type="text" id="jobRoom" placeholder="e.g. Prep, Retail 1, Mill Room" />

        <div class="row-2">
          <div>
            <label for="jobLine">Line (Optional)</label>
            <input type="text" id="jobLine" placeholder="e.g. DSI, AMF 4, Thigh Deboning" />
          </div>
          <div>
            <label for="jobMachineSelect">Saved Machine (Optional)</label>
            <select id="jobMachineSelect">
              <option value="">-- Unassigned / Custom --</option>
            </select>
          </div>
        </div>

        <label for="jobMachineName">Machine Name</label>
        <input type="text" id="jobMachineName" placeholder="e.g. DSI, AMF 4, RTL-001" />

        <div id="logAssetNotice" class="notice" style="display:none;"></div>

        <div id="manualFields">
          <div class="row-2">
            <div>
              <label for="jobDate">Date</label>
              <input type="date" id="jobDate" />
            </div>
            <div>
              <label for="jobHours">Hours Worked</label>
              <input type="number" step="0.01" min="0.01" id="jobHours" placeholder="e.g. 1.50" />
            </div>
          </div>
        </div>

        <label for="jobNotes">Notes</label>
        <textarea id="jobNotes" rows="2" placeholder="Fault details, adjustment, callback notes..."></textarea>

        <label for="jobParts">Parts Logged (comma separated)</label>
        <input type="text" id="jobParts" placeholder="e.g. Conveyor belt, O-ring kit" />

        <div class="row-2">
          <button class="btn btn-secondary" id="cancelJobBtn" type="button">Cancel</button>
          <button class="btn" id="saveJobBtn" type="button" style="background:var(--green);color:#fff;">Save Job</button>
        </div>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section class="panel" id="panel-history">
      <div class="card">
        <div class="row-2">
          <button class="btn btn-sm" id="filterAllBtn" style="background:var(--green);color:#fff;">All Logs</button>
          <button class="btn btn-sm btn-secondary" id="filterTodayBtn">Today Only</button>
        </div>
        <div style="margin-top:10px;">
          <input type="text" id="historySearch" placeholder="Search room, line, machine, asset ID, notes..." style="margin-bottom:0;" />
        </div>
      </div>
      <div id="historyList"></div>
    </section>

    <!-- MACHINES TAB -->
    <section class="panel" id="panel-machines">
      <div class="card">
        <div class="card-title">Add Machine (Asset ID Optional Now)</div>
        <label for="newMachineRoom">Room ID</label>
        <input type="text" id="newMachineRoom" placeholder="e.g. Prep" />

        <label for="newMachineLine">Line (Optional — can be a machine line like DSI or AMF 4)</label>
        <input type="text" id="newMachineLine" placeholder="e.g. DSI, Nandos Line 1, Thigh Deboning Line" />

        <label for="newMachineName">Machine Name</label>
        <input type="text" id="newMachineName" placeholder="e.g. DSI, AMF 4, RTL-001" />

        <button class="btn" id="saveMachineBtn" style="background:var(--green);color:#fff;">Save Machine</button>
      </div>

      <div class="card">
        <div class="card-title">Saved Machines &amp; Asset Coverage</div>
        <div id="missingAssetSummary" class="item-sub" style="margin-bottom:10px;"></div>
        <div id="machinesList"></div>
      </div>
    </section>
  </div>

  <!-- Undo Toast for History Deletes -->
  <div class="toast" id="undoToast">
    <span id="undoToastText">Job deleted</span>
    <button class="btn btn-sm btn-outline" id="undoDeleteBtn">Undo</button>
  </div>

  <script>
    const STORAGE_KEY = 'shift_machine_log_v2';
    const TWENTY_FOUR_HOURS_MS = 24 * 60 * 60 * 1000;

    let state = loadState();
    let activeTimer = null; // { startTime, room, line, machineId, machineName }
    let historyFilter = 'all';
    let lastDeleted = null; // { item, index, timerId }
    let expandedRepeatKey = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        machines: [
          {
            id: 'm-1',
            room: 'Retail 1',
            line: '',
            name: 'RTL-001',
            assetId: 'AST-1042'
          }
        ],
        logs: []
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function updateHeaderHours() {
      const today = todayISO();
      const total = state.logs
        .filter(l => l.date === today)
        .reduce((sum, l) => sum + (Number(l.hours) || 0), 0);
      document.getElementById('todayHoursPill').textContent = `Today: ${total.toFixed(2)}h`;
    }

    // Machine key for 24h linking (prefers assetId, falls back to room+line+name)
    function getMachineIdentity(entry) {
      const asset = (entry.assetId || '').trim().toLowerCase();
      if (asset) return `asset:${asset}`;
      const room = (entry.room || '').trim().toLowerCase();
      const line = (entry.line || '').trim().toLowerCase();
      const name = (entry.machineName || '').trim().toLowerCase();
      return `fallback:${room}|${line}|${name}`;
    }

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
        if (btn.dataset.tab === 'history') renderHistory();
        if (btn.dataset.tab === 'machines') renderMachines();
      });
    });

    // Log Tab: Start Work / Manual Entry
    function populateMachineSelect() {
      const sel = document.getElementById('jobMachineSelect');
      sel.innerHTML = '<option value="">-- Unassigned / Custom --</option>';
      state.machines.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        const missingTag = m.assetId ? ` [${m.assetId}]` : ' [Machine ID missing]';
        opt.textContent = `${m.name}${missingTag} (${m.room}${m.line ? ' > ' + m.line : ''})`;
        sel.appendChild(opt);
      });
    }

    function updateLogAssetNotice() {
      const notice = document.getElementById('logAssetNotice');
      const selectedId = document.getElementById('jobMachineSelect').value;
      const roomVal = document.getElementById('jobRoom').value.trim() || 'Unspecified';
      const machineName = document.getElementById('jobMachineName').value.trim();

      if (selectedId) {
        const m = state.machines.find(x => x.id === selectedId);
        if (m && !m.assetId) {
          notice.style.display = 'block';
          notice.innerHTML = `<strong>Machine ID missing</strong> &middot; Room ID: <strong>${escapeHtml(m.room)}</strong>. You can log now and add the asset ID later in Machines.`;
          return;
        }
      } else if (machineName) {
        notice.style.display = 'block';
        notice.innerHTML = `<strong>Machine ID missing</strong> &middot; Room ID: <strong>${escapeHtml(roomVal)}</strong>.`;
        return;
      }
      notice.style.display = 'none';
    }

    document.getElementById('jobMachineSelect').addEventListener('change', e => {
      const m = state.machines.find(x => x.id === e.target.value);
      if (m) {
        document.getElementById('jobRoom').value = m.room;
        document.getElementById('jobLine').value = m.line || '';
        document.getElementById('jobMachineName').value = m.name;
      }
      updateLogAssetNotice();
    });
    document.getElementById('jobRoom').addEventListener('input', updateLogAssetNotice);
    document.getElementById('jobMachineName').addEventListener('input', updateLogAssetNotice);

    document.getElementById('startWorkBtn').addEventListener('click', () => {
      populateMachineSelect();
      document.getElementById('jobFormTitle').textContent = 'Start Job';
      document.getElementById('manualFields').style.display = 'none';
      document.getElementById('saveJobBtn').textContent = 'Start Timer / Log';
      document.getElementById('jobFormCard').dataset.mode = 'timer';
      document.getElementById('jobFormCard').style.display = 'block';
      updateLogAssetNotice();
    });

    document.getElementById('manualEntryBtn').addEventListener('click', () => {
      populateMachineSelect();
      document.getElementById('jobFormTitle').textContent = 'Log Manual / Past Entry';
      document.getElementById('manualFields').style.display = 'block';
      document.getElementById('jobDate').value = todayISO();
      document.getElementById('saveJobBtn').textContent = 'Save Manual Job';
      document.getElementById('jobFormCard').dataset.mode = 'manual';
      document.getElementById('jobFormCard').style.display = 'block';
      updateLogAssetNotice();
    });

    document.getElementById('cancelJobBtn').addEventListener('click', () => {
      document.getElementById('jobFormCard').style.display = 'none';
    });

    document.getElementById('saveJobBtn').addEventListener('click', () => {
      const mode = document.getElementById('jobFormCard').dataset.mode;
      const room = document.getElementById('jobRoom').value.trim() || 'Unassigned';
      const line = document.getElementById('jobLine').value.trim();
      const machineId = document.getElementById('jobMachineSelect').value;
      const machineName = document.getElementById('jobMachineName').value.trim() || 'Unassigned Machine';
      const notes = document.getElementById('jobNotes').value.trim();
      const parts = document.getElementById('jobParts').value
        .split(',')
        .map(p => p.trim())
        .filter(Boolean);

      const matchedMachine = state.machines.find(m => m.id === machineId);
      const assetId = matchedMachine ? (matchedMachine.assetId || '') : '';

      if (mode === 'timer') {
        activeTimer = {
          startMs: Date.now(),
          room,
          line,
          machineId,
          machineName,
          assetId,
          notes,
          parts
        };
        const box = document.getElementById('activeWorkBox');
        box.style.display = 'block';
        box.innerHTML = `
          <div class="item-top">
            <div>
              <div class="item-title">Active Job: ${escapeHtml(machineName)}</div>
              <div class="item-sub">Room ID: ${escapeHtml(room)}${line ? ' &middot; Line: ' + escapeHtml(line) : ''}</div>
              ${!assetId ? '<div style="margin-top:4px;"><span class="badge badge-warn">Machine ID missing</span></div>' : ''}
            </div>
            <button class="btn btn-sm" id="finishTimerBtn" style="background:var(--green);color:#fff;">Finish &amp; Log</button>
          </div>
        `;
        document.getElementById('finishTimerBtn').addEventListener('click', () => {
          const elapsedHours = Math.max(0.01, (Date.now() - activeTimer.startMs) / 3600000);
          const now = new Date();
          state.logs.unshift({
            id: 'log-' + Date.now(),
            timestamp: now.getTime(),
            date: now.toISOString().slice(0, 10),
            room: activeTimer.room,
            line: activeTimer.line,
            machineId: activeTimer.machineId,
            machineName: activeTimer.machineName,
            assetId: activeTimer.assetId,
            hours: Number(elapsedHours.toFixed(2)),
            notes: activeTimer.notes || notes,
            parts: activeTimer.parts.length ? activeTimer.parts : parts
          });
          activeTimer = null;
          box.style.display = 'none';
          saveState();
          updateHeaderHours();
          renderHistory();
        });
      } else {
        const dateVal = document.getElementById('jobDate').value || todayISO();
        const hoursVal = parseFloat(document.getElementById('jobHours').value) || 0;
        const ts = new Date(dateVal + 'T12:00:00').getTime();
        state.logs.unshift({
          id: 'log-' + Date.now(),
          timestamp: ts,
          date: dateVal,
          room,
          line,
          machineId,
          machineName,
          assetId,
          hours: hoursVal,
          notes,
          parts
        });
        saveState();
        updateHeaderHours();
        renderHistory();
      }

      document.getElementById('jobFormCard').style.display = 'none';
      document.getElementById('jobNotes').value = '';
      document.getElementById('jobParts').value = '';
    });

    // 24-Hour Repeat Job Linking Helper
    function find24HourRelatedJobs(targetLog, allLogs) {
      return allLogs.filter(other => {
        if (other.id === targetLog.id) return false;
        if (getMachineIdentity(other) !== getMachineIdentity(targetLog)) return false;
        return Math.abs((other.timestamp || 0) - (targetLog.timestamp || 0)) <= TWENTY_FOUR_HOURS_MS;
      });
    }

    // History Tab + Individual Delete + 24h Repeat Linking
    document.getElementById('filterAllBtn').addEventListener('click', () => {
      historyFilter = 'all';
      renderHistory();
    });
    document.getElementById('filterTodayBtn').addEventListener('click', () => {
      historyFilter = 'today';
      renderHistory();
    });
    document.getElementById('historySearch').addEventListener('input', renderHistory);

    function renderHistory() {
      const container = document.getElementById('historyList');
      const query = document.getElementById('historySearch').value.trim().toLowerCase();
      const today = todayISO();

      const filtered = state.logs.filter(log => {
        if (historyFilter === 'today' && log.date !== today) return false;
        if (!query) return true;
        return [log.room, log.line, log.machineName, log.assetId, log.notes, (log.parts || []).join(' ')]
          .join(' ')
          .toLowerCase()
          .includes(query);
      });

      if (!filtered.length) {
        container.innerHTML = '<div class="card"><div class="item-sub">No matching jobs logged yet.</div></div>';
        return;
      }

      container.innerHTML = filtered.map(log => {
        const related = find24HourRelatedJobs(log, state.logs);
        const hasRepeat = related.length > 0;
        const groupHours = (Number(log.hours) || 0) + related.reduce((s, r) => s + (Number(r.hours) || 0), 0);
        const repeatKey = `${log.id}`;
        const isExpanded = expandedRepeatKey === repeatKey;

        return `
          <div class="item-card" data-log-id="${log.id}">
            <div class="item-top">
              <div>
                <div class="item-title">${escapeHtml(log.machineName)}</div>
                <div class="item-sub">Room ID: ${escapeHtml(log.room)}${log.line ? ' &middot; Line: ' + escapeHtml(log.line) : ''}</div>
              </div>
              <span class="badge badge-ok">${Number(log.hours || 0).toFixed(2)}h</span>
            </div>

            <div class="item-actions">
              <span class="item-sub" style="margin-top:0;">${escapeHtml(log.date)}</span>
              ${log.assetId
                ? `<span class="badge badge-ok">Asset: ${escapeHtml(log.assetId)}</span>`
                : `<span class="badge badge-warn">Machine ID missing &middot; Room ${escapeHtml(log.room)}</span>`
              }
              ${hasRepeat
                ? `<button type="button" class="badge badge-repeat toggle-repeat-btn" data-repeat-key="${repeatKey}">
                     24h Linked (${related.length + 1} jobs &middot; ${groupHours.toFixed(2)}h)
                   </button>`
                : ''
              }
            </div>

            <div class="item-sub" style="margin-top:8px;"><strong>Notes:</strong> ${escapeHtml(log.notes || 'None')}</div>
            <div class="item-sub"><strong>Parts:</strong> ${log.parts && log.parts.length ? escapeHtml(log.parts.join(', ')) : 'No parts logged'}</div>

            ${hasRepeat && isExpanded ? `
              <div class="linked-box">
                <strong>Linked jobs within 24 hours on this machine:</strong>
                ${related.map(r => `
                  <div class="linked-row">
                    ${escapeHtml(r.date)} &middot; ${escapeHtml(r.machineName)} (${Number(r.hours || 0).toFixed(2)}h) &mdash; ${escapeHtml(r.notes || 'No notes')}
                  </div>
                `).join('')}
              </div>
            ` : ''}

            <div class="item-actions" style="justify-content:flex-end;">
              <button type="button" class="btn btn-sm btn-danger delete-log-btn" data-delete-id="${log.id}">Delete Job</button>
            </div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('.toggle-repeat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const k = btn.dataset.repeatKey;
          expandedRepeatKey = expandedRepeatKey === k ? null : k;
          renderHistory();
        });
      });

      container.querySelectorAll('.delete-log-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.deleteId;
          const idx = state.logs.findIndex(x => x.id === id);
          if (idx === -1) return;
          const [removed] = state.logs.splice(idx, 1);
          saveState();
          updateHeaderHours();
          renderHistory();
          showUndoToast(removed, idx);
        });
      });
    }

    function showUndoToast(removed, index) {
      if (lastDeleted && lastDeleted.timerId) clearTimeout(lastDeleted.timerId);
      const toast = document.getElementById('undoToast');
      document.getElementById('undoToastText').textContent = `Deleted "${removed.machineName}" (${Number(removed.hours || 0).toFixed(2)}h)`;
      toast.classList.add('show');
      const timerId = setTimeout(() => {
        toast.classList.remove('show');
        lastDeleted = null;
      }, 6000);
      lastDeleted = { item: removed, index, timerId };
    }

    document.getElementById('undoDeleteBtn').addEventListener('click', () => {
      if (!lastDeleted) return;
      clearTimeout(lastDeleted.timerId);
      state.logs.splice(lastDeleted.index, 0, lastDeleted.item);
      lastDeleted = null;
      document.getElementById('undoToast').classList.remove('show');
      saveState();
      updateHeaderHours();
      renderHistory();
    });

    // Machines Tab: Save without Asset ID, Add/Edit Asset ID later, Missing %
    document.getElementById('saveMachineBtn').addEventListener('click', () => {
      const room = document.getElementById('newMachineRoom').value.trim();
      const name = document.getElementById('newMachineName').value.trim();
      const line = document.getElementById('newMachineLine').value.trim();
      if (!room || !name) return;

      state.machines.unshift({
        id: 'm-' + Date.now(),
        room,
        line,
        name,
        assetId: ''
      });
      saveState();
      document.getElementById('newMachineRoom').value = '';
      document.getElementById('newMachineLine').value = '';
      document.getElementById('newMachineName').value = '';
      renderMachines();
    });

    function renderMachines() {
      const total = state.machines.length;
      const missingCount = state.machines.filter(m => !m.assetId || !m.assetId.trim()).length;
      const pct = total ? Math.round((missingCount / total) * 100) : 0;

      document.getElementById('missingAssetSummary').textContent =
        `Missing Asset ID: ${missingCount} of ${total} machines (${pct}%)`;

      const list = document.getElementById('machinesList');
      if (!total) {
        list.innerHTML = '<div class="item-sub">No machines saved yet.</div>';
        return;
      }

      list.innerHTML = state.machines.map(m => {
        const hasAsset = m.assetId && m.assetId.trim();
        return `
          <div class="item-card">
            <div class="item-top">
              <div>
                <div class="item-title">${escapeHtml(m.name)}</div>
                <div class="item-sub">Room ID: ${escapeHtml(m.room)}${m.line ? ' &middot; Line: ' + escapeHtml(m.line) : ''}</div>
              </div>
              ${hasAsset
                ? `<span class="badge badge-ok">Asset: ${escapeHtml(m.assetId)}</span>`
                : `<span class="badge badge-warn">Machine ID missing &middot; Room ${escapeHtml(m.room)}</span>`
              }
            </div>
            <div class="item-actions">
              <button type="button" class="btn btn-sm btn-outline edit-asset-btn" data-machine-id="${m.id}">
                ${hasAsset ? 'Edit Asset ID' : 'Add Asset ID'}
              </button>
              <button type="button" class="btn btn-sm btn-danger remove-machine-btn" data-machine-id="${m.id}">
                Remove
              </button>
            </div>
          </div>
        `;
      }).join('');

      list.querySelectorAll('.edit-asset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const m = state.machines.find(x => x.id === btn.dataset.machineId);
          if (!m) return;
          const nextAsset = prompt(`Enter Asset ID for ${m.name} (Room ID: ${m.room}):`, m.assetId || '');
          if (nextAsset === null) return;
          m.assetId = nextAsset.trim();
          // Keep existing logs for this machine in sync if they didn't have an assetId yet
          state.logs.forEach(log => {
            if (log.machineId === m.id && !log.assetId) {
              log.assetId = m.assetId;
            }
          });
          saveState();
          renderMachines();
          renderHistory();
        });
      });

      list.querySelectorAll('.remove-machine-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.machines = state.machines.filter(x => x.id !== btn.dataset.machineId);
          saveState();
          renderMachines();
        });
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Init
    updateHeaderHours();
    renderMachines();
    renderHistory();
  </script>
</body>
</html>
